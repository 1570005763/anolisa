<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">SkillFS + Skill Ledger value comparison</title>
  <desc id="desc">A Chinese infographic comparing agent hook based skill monitoring with SkillFS plus Skill Ledger system-level runtime boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faf7"/>
      <stop offset="0.55" stop-color="#eef6f2"/>
      <stop offset="1" stop-color="#f6f7fb"/>
    </linearGradient>
    <linearGradient id="oldPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#fff1f2"/>
    </linearGradient>
    <linearGradient id="newPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d73b7"/>
      <stop offset="1" stop-color="#2854c5"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15803d"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#112018" flood-opacity="0.14"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#059669"/>
    </marker>
    <style>
      text { font-family: Inter, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #17231f; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .title { font-size: 44px; font-weight: 800; letter-spacing: 0; }
      .subtitle { font-size: 22px; fill: #5b6b63; }
      .panelTitle { font-size: 28px; font-weight: 800; }
      .panelSub { font-size: 18px; fill: #68766f; }
      .nodeTitle { font-size: 20px; font-weight: 760; }
      .nodeText { font-size: 15px; fill: #5b6b63; }
      .tag { font-size: 15px; font-weight: 760; fill: #ffffff; }
      .small { font-size: 14px; fill: #66746d; }
      .metricTitle { font-size: 22px; font-weight: 800; }
      .metricText { font-size: 16px; fill: #53635b; }
      .danger { fill: #b91c1c; }
      .success { fill: #047857; }
      .muted { fill: #66746d; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="140" cy="118" r="112" fill="#dbeafe" opacity="0.45"/>
  <circle cx="1460" cy="90" r="150" fill="#dcfce7" opacity="0.55"/>
  <circle cx="1420" cy="820" r="170" fill="#fee2e2" opacity="0.28"/>

  <text x="80" y="84" class="title">SkillFS + Skill Ledger：从可信记录到运行边界</text>
  <text x="82" y="124" class="subtitle">把 Skill 的安全判断前移到文件系统层，并让 Agent 始终只看到“应该被执行”的版本。</text>

  <g filter="url(#shadow)">
    <rect x="70" y="165" width="680" height="520" rx="28" fill="url(#oldPanel)" stroke="#f3c8bd" stroke-width="2"/>
    <rect x="850" y="165" width="680" height="520" rx="28" fill="url(#newPanel)" stroke="#b8d9cc" stroke-width="2"/>
  </g>

  <g>
    <rect x="104" y="202" width="126" height="34" rx="17" fill="#b45309"/>
    <text x="126" y="225" class="tag">之前</text>
    <text x="104" y="276" class="panelTitle">Agent Hook 采样式监控</text>
    <text x="104" y="309" class="panelSub">安全判断发生在 Agent 使用时，覆盖依赖触发点。</text>

    <g>
      <rect x="114" y="358" width="210" height="76" rx="18" fill="#ffffff" stroke="#f3c8bd"/>
      <text x="140" y="388" class="nodeTitle">用户调用 Skill</text>
      <text x="140" y="414" class="nodeText">Agent 开始任务</text>

      <rect x="390" y="358" width="220" height="76" rx="18" fill="#ffffff" stroke="#f3c8bd"/>
      <text x="416" y="388" class="nodeTitle">Hook 被动触发</text>
      <text x="416" y="414" class="nodeText">使用时才扫描</text>

      <line x1="324" y1="396" x2="384" y2="396" stroke="#dc2626" stroke-width="3" marker-end="url(#arrowRed)"/>

      <rect x="390" y="470" width="220" height="82" rx="18" fill="#fff7f7" stroke="#ef8a8a"/>
      <text x="416" y="501" class="nodeTitle danger">阻断当前访问</text>
      <text x="416" y="528" class="nodeText">任务被打断，Agent 可能重试</text>

      <line x1="500" y1="434" x2="500" y2="462" stroke="#dc2626" stroke-width="3" marker-end="url(#arrowRed)"/>

      <path d="M218 434 C218 510, 250 576, 370 585" fill="none" stroke="#b91c1c" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrowRed)"/>
      <rect x="390" y="575" width="260" height="70" rx="18" fill="#fff1f2" stroke="#dc2626"/>
      <text x="416" y="604" class="nodeTitle danger">绕路读取原始文件</text>
      <text x="416" y="629" class="nodeText">恶意内容仍可能进入上下文</text>
    </g>

    <g>
      <rect x="126" y="480" width="182" height="42" rx="21" fill="#fee2e2"/>
      <text x="148" y="507" class="danger" style="font-size:17px;font-weight:760">覆盖不完整</text>
      <rect x="126" y="535" width="182" height="42" rx="21" fill="#ffedd5"/>
      <text x="148" y="562" fill="#9a3412" style="font-size:17px;font-weight:760">延迟在使用时出现</text>
      <rect x="126" y="590" width="182" height="42" rx="21" fill="#fef3c7"/>
      <text x="148" y="617" fill="#854d0e" style="font-size:17px;font-weight:760">风险会打断任务</text>
    </g>
  </g>

  <g>
    <rect x="884" y="202" width="126" height="34" rx="17" fill="url(#green)"/>
    <text x="906" y="225" class="tag">现在</text>
    <text x="884" y="276" class="panelTitle">SkillFS 系统级运行边界</text>
    <text x="884" y="309" class="panelSub">文件读写 syscall 先进入 SkillFS，再执行安全决策。</text>

    <g>
      <rect x="900" y="346" width="520" height="82" rx="22" fill="#0f172a" opacity="0.92"/>
      <text x="926" y="376" style="font-size:18px;font-weight:800;fill:#bfdbfe">OS syscall stream</text>
      <text x="926" y="407" class="mono" style="font-size:17px;fill:#e2e8f0">open()  read()  write()  mkdir()  rename()  unlink()  truncate()</text>

      <rect x="900" y="458" width="300" height="116" rx="20" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
      <text x="926" y="490" class="nodeTitle">SkillFS / FUSE</text>
      <text x="926" y="518" class="nodeText">所有 Skill 文件读写先进入系统级边界</text>
      <text x="926" y="543" class="nodeText">写入触发状态更新；读取执行安全映射</text>

      <rect x="1230" y="458" width="190" height="116" rx="20" fill="#ffffff" stroke="#99d6b6" stroke-width="2"/>
      <text x="1256" y="490" class="nodeTitle">Skill Ledger</text>
      <text x="1256" y="518" class="nodeText">scan / resolve</text>
      <text x="1256" y="543" class="nodeText">可信状态与版本链</text>

      <line x1="1016" y1="428" x2="1016" y2="452" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
      <line x1="1200" y1="516" x2="1224" y2="516" stroke="#059669" stroke-width="3" marker-end="url(#arrowGreen)"/>
      <path d="M1325 574 C1325 604, 1285 614, 1198 614" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#arrowGreen)"/>

      <rect x="900" y="604" width="420" height="56" rx="20" fill="#f8fffb" stroke="#99d6b6"/>
      <text x="926" y="639" class="nodeTitle">Active Mapping</text>
      <rect x="1122" y="617" width="82" height="28" rx="14" fill="#dbeafe"/>
      <text x="1140" y="637" class="small" style="font-weight:800;fill:#1d4ed8">current</text>
      <rect x="1214" y="617" width="88" height="28" rx="14" fill="#dcfce7"/>
      <text x="1230" y="637" class="small" style="font-weight:800;fill:#047857">fallback</text>
      <rect x="1312" y="617" width="74" height="28" rx="14" fill="#f1f5f9"/>
      <text x="1328" y="637" class="small" style="font-weight:800;fill:#64748b">hidden</text>

      <path d="M900 516 C860 516, 860 632, 892 632" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrowBlue)"/>
      <text x="915" y="590" class="small">Agent 读取同名入口时执行映射结果</text>
    </g>
  </g>

  <g>
    <rect x="740" y="376" width="120" height="84" rx="42" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
    <text x="778" y="410" class="mono" style="font-size:22px;font-weight:800;fill:#2563eb">FS</text>
    <text x="767" y="438" class="small">统一入口</text>
    <path d="M705 418 C735 418, 755 418, 780 418" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrowBlue)"/>
    <path d="M820 418 C850 418, 866 418, 892 418" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrowBlue)"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="720" width="460" height="112" rx="24" fill="#ffffff" stroke="#dbe7df"/>
    <rect x="570" y="720" width="460" height="112" rx="24" fill="#ffffff" stroke="#dbe7df"/>
    <rect x="1070" y="720" width="460" height="112" rx="24" fill="#ffffff" stroke="#dbe7df"/>
  </g>

  <g>
    <circle cx="116" cy="776" r="26" fill="#fee2e2"/>
    <text x="105" y="785" style="font-size:24px;font-weight:900;fill:#b91c1c">1</text>
    <text x="160" y="765" class="metricTitle">安全提升</text>
    <text x="160" y="797" class="metricText">系统级监控覆盖全生命周期，恶意 Skill 更难绕过入口。</text>
  </g>
  <g>
    <circle cx="616" cy="776" r="26" fill="#dbeafe"/>
    <text x="605" y="785" style="font-size:24px;font-weight:900;fill:#1d4ed8">2</text>
    <text x="660" y="765" class="metricTitle">效率提升</text>
    <text x="660" y="797" class="metricText">写入即扫描更新，用户调用时直接使用已有安全决策。</text>
  </g>
  <g>
    <circle cx="1116" cy="776" r="26" fill="#dcfce7"/>
    <text x="1105" y="785" style="font-size:24px;font-weight:900;fill:#047857">3</text>
    <text x="1160" y="765" class="metricTitle">体验提升</text>
    <text x="1160" y="797" class="metricText">同名入口不变，风险版本自动回退到最近可信版本。</text>
  </g>

  <text x="80" y="870" class="small">核心变化：Skill Ledger 提供可信记录与版本链，SkillFS 把这份记录执行为 Agent 可见的运行边界。</text>
</svg>
