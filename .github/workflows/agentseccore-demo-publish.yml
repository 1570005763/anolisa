name: Publish AgentSecCore demo

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agentseccore-demo-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == '1570005763/anolisa'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download the unchanged accepted image archive
        shell: bash
        run: |
          set -euo pipefail
          gh release download agentseccore-demo-20260910 --repo "$GITHUB_REPOSITORY" \
            --pattern image.tar.gz --dir "$RUNNER_TEMP"
          python3 - <<'PY'
          import os, pathlib, sys
          sys.path.insert(0, 'tools/agentseccore-demo')
          from package import IMAGE_REFERENCE, IMAGE_SHA256, digest
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          assert digest(root / 'image.tar.gz') == IMAGE_SHA256
          (root / 'image.ref').write_text(IMAGE_REFERENCE + '\n')
          PY
      - name: Check and package one release
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/agentseccore-demo/check.py
          python3 tools/agentseccore-demo/check-ecs.py
          python3 tools/agentseccore-demo/check-release.py
          python3 tools/agentseccore-demo/package.py "$RUNNER_TEMP/image.tar.gz" \
            "$RUNNER_TEMP/image.ref" "$RUNNER_TEMP/release"
      - name: Publish without replacing assets
        run: python3 tools/agentseccore-demo/publish.py "$RUNNER_TEMP/release" "$GITHUB_SHA"
